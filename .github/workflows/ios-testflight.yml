name: iOS TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion. Leave blank to use the GitHub run number."
        required: false
      upload_to_testflight:
        description: "Upload the signed IPA to App Store Connect/TestFlight."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  archive:
    name: Archive and Export ToolVault AI
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_BUNDLE_ID: com.toolvaultai.app
      APPLE_TEAM_ID: 5ZP6GV85J6
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | head -n 1 || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Xcode 26 is required for App Store Connect uploads after Apple's April 28, 2026 SDK requirement."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iPhoneOS SDK $SDK_VERSION"

          XCODE_VERSION="$(xcodebuild -version | sed -n 's/^Xcode //p' | head -n 1)"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::App Store Connect requires Xcode 26 or later for iOS uploads. Selected: $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi

      - name: Install iOS platform
        run: |
          set -euo pipefail
          xcodebuild -downloadPlatform iOS -architectureVariant arm64

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Select build number
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "TOOLVAULT_BUILD_NUMBER=${{ inputs.build_number }}" >> "$GITHUB_ENV"
          else
            echo "TOOLVAULT_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install signing assets
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/toolvault-appstore.mobileprovision"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          API_PRIVATE_KEYS_DIR_PATH="$RUNNER_TEMP/private_keys"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/toolvault-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          mkdir -p \
            "$API_PRIVATE_KEYS_DIR_PATH" \
            "$HOME/private_keys" \
            "$HOME/.private_keys" \
            "$HOME/.appstoreconnect/private_keys"
          cp "$API_KEY_PATH" "$API_PRIVATE_KEYS_DIR_PATH/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          cp "$API_KEY_PATH" "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          cp "$API_KEY_PATH" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          cp "$API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          echo "TOOLVAULT_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$API_PRIVATE_KEYS_DIR_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ToolVaultAI.xcodeproj \
            -scheme ToolVaultAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ToolVaultAI.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$TOOLVAULT_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$TOOLVAULT_PROFILE_NAME" \
            clean archive

      - name: Export IPA
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$TOOLVAULT_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ToolVaultAI.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolVaultAI-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight == 'true' }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          upload_status=${PIPESTATUS[0]}
          set -e
          if [ "$upload_status" -ne 0 ]; then
            tail -n 80 "$UPLOAD_LOG"
            echo "::error title=App Store Connect upload failed::altool upload failed. See ToolVaultAI-upload-diagnostics artifact for the full log."
            exit "$upload_status"
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ToolVaultAI-upload-diagnostics
          path: ${{ runner.temp }}/*upload*.log
          if-no-files-found: ignore
